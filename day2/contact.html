    <h1>Contact or Book Raw 360 Service</h1>
    <div class="card">
        <form action="" method="">
            <div>
                <label>Customer Name</label>
                <input type="text" name="customer" placeholder="Name of the customer" />
            </div>
            <div>
                <label>Like to Book for</label>
                <input type="checkbox" name="ac" value="AC"/>Air Conditioner
                <input type="checkbox" name="washingmachine" value="WashingMachine"/>Washing MAchine
                <input type="checkbox" name="fridge" value="Refridgerator"/>Refridgerator
            </div>
            <div>
                <label>KM Radius from Salem</label>
                <input type="radio" name="dist" value="city"/>With In 15KM
                <input type="radio" name="dist" value="city"/>Beyond 15KM
            </div>
            <div>
                <label>Select Payment Method</label>
                <select>
                    <option>Select Any Payment</option>
                    <option>UPI</option>
                    <option>COD</option>
                </select>
            </div>
            <div>
                <textarea name="address" placeholder="Enter Complete Address"></textarea>
            </div>
            <div>
                <label>Customer Contact</label>
                <input type="tel" name="contact" placeholder="Let us know contact number"/>
            </div>
            <div id="btngrp">
                <button>Book</button>
                <button>Cancel</button>
            </div>
        </form>
    </div>
